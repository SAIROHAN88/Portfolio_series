name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once — they would race on the same Pages slot.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Regenerate the resume PDF
        # Chrome is preinstalled on ubuntu-latest, so the PDF always matches
        # the current content rather than a stale committed copy.
        # It renders dist/resume.html, so the build above must run first.
        run: npm run resume
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Copy the fresh PDF into the build output
        # The PDF is written to public/assets, but `vite build` already copied
        # public/ into dist — so put the new file into dist too.
        run: cp public/assets/Sai_Rohan_Resume.pdf dist/assets/Sai_Rohan_Resume.pdf

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
