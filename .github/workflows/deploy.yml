name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never run two deploys at once — they would race on the same branch.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Regenerate the resume PDF
        # Chrome is preinstalled on ubuntu-latest, so the PDF always matches
        # the current content rather than a stale committed copy.
        # It renders dist/resume.html, so the build above must run first.
        run: npm run resume
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Copy the fresh PDF into the build output
        # The PDF is written to public/assets, but `vite build` already copied
        # public/ into dist — so put the new file into dist too.
        run: cp public/assets/Sai_Rohan_Resume.pdf dist/assets/Sai_Rohan_Resume.pdf

      - name: Publish to the gh-pages branch
        # Publishing the built site to a `gh-pages` branch is the most
        # widely-supported way to serve a static site from GitHub Pages:
        # the branch is the site root, so `dist/index.html` becomes the
        # homepage and `dist/assets/*` are served from the site root.
        #
        # The site must be served from the repo root path, so the build has
        # to use a base of "/" — the gh-pages branch is served at
        # https://<user>.github.io/<repo>/, and relative asset paths work
        # from there.
        env:
          VITE_BASE_PATH: /
        run: |
          npx vite build
          cp public/assets/Sai_Rohan_Resume.pdf dist/assets/Sai_Rohan_Resume.pdf
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
